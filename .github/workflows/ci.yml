# ============================================================
# CI — линтер + тесты на каждый push и PR
#
# Что проверяем:
# 1. lint   — ruff (стиль + статические ошибки)
# 2. tests  — весь pytest-сьют: тесты изолированы от инфраструктуры
#            (sqlite in-memory, моки Kafka/MinIO, eager-Celery, сгенерированное видео),
#            поэтому гоняются на обычном раннере без Docker/GPU
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check app dashboard tests

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Сначала ставим CPU-сборку torch, иначе pip утянет CUDA-дистрибутив (~2.5 GB)
      - name: Install torch (CPU)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
