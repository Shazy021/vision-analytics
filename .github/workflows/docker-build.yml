name: docker-build

on:
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-cpu:
    name: Build CPU image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build vap-cpu
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cpu
          tags: vap-cpu:ci
          load: true
          provenance: false
          cache-from: type=gha,scope=cpu
          cache-to: type=gha,mode=max,scope=cpu

      - name: Smoke test (imports inside the built image)
        run: |
          docker run --rm --entrypoint python vap-cpu:ci \
            -c "import cv2, numpy; import app.main; print('cpu image smoke: OK')"

  build-cuda:
    name: Build CUDA image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghc-overlay /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/lib/jvm /usr/share/swift
          sudo docker image prune --all --force
          df -h /

      - name: Move Docker data to /mnt
        run: |
          sudo systemctl stop docker
          sudo mv /var/lib/docker /mnt/docker
          sudo ln -s /mnt/docker /var/lib/docker
          sudo systemctl start docker

      - uses: docker/setup-buildx-action@v3

      - name: Build vap-cuda
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: vap-cuda:ci
          load: true
          provenance: false
          cache-from: type=gha,scope=cuda
          cache-to: type=gha,mode=min,scope=cuda

      - name: Smoke test (imports inside the built image)
        run: |
          docker run --rm --entrypoint python vap-cuda:ci \
            -c "import cv2, numpy, ultralytics; print('cuda image smoke: OK')"
