name: docker-build

on:
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-cpu:
    name: Build CPU image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build vap-cpu
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cpu
          tags: vap-cpu:ci
          load: true
          provenance: false
          cache-from: type=gha,scope=cpu
          cache-to: type=gha,mode=max,scope=cpu

      - name: Smoke test (imports inside the built image)
        run: |
          docker run --rm --entrypoint python vap-cpu:ci \
            -c "import cv2, numpy, tritonclient.grpc; import app.main; \
                import app.processing.processor; print('image smoke: OK')"
