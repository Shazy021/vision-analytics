# ============================================================
# Vision Analytics Platform — Docker Compose
#
# Все секреты и хосты подставляются из переменных окружения:
# compose читает их из файла .env в корне проекта (см. .env.example).
# Формат ${VAR:-default} = взять VAR из .env, а если его нет — дефолт.
# Дефолты безопасны для локальной разработки и НЕ содержат реальных секретов.
#
# GPU: базовый файл работает на ЛЮБОЙ машине — GPU-резервы вынесены в
# docker-compose.gpu.yml. На NVIDIA-машине подключи его вручную или используй
# make up (Makefile сам определит GPU по nvidia-smi и добавит override-файл).
#
# ОБРАЗЫ (vap = Vision Analytics Platform):
#   vap-cuda — torch+CUDA, только video-consumer и yolo-consumer (инференс, ~10-11 GB)
#   vap-cpu  — без torch: api, detection-consumer, stream-manager, dashboard (~2 GB)
# Оба строятся один раз: сервисы с одинаковыми build+image делят один образ.
# ============================================================

services:
  # ============================================================
  # PostgreSQL — база данных
  # ============================================================
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DB:-vision}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-vision}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # FastAPI — бэкенд
  # ============================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: vap-cpu:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@db:5432/${POSTGRES_DB:-vision}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      # Presigned URL для браузера (st.video в дашборде) подписываем
      # публичным адресом — браузер не резолвит minio:9000 из docker-сети.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin123}
      S3_BUCKET: ${S3_BUCKET:-vision}
      # Чанкование: API планирует план диспетчеризации при загрузке
      VIDEO_CHUNK_SEC: ${VIDEO_CHUNK_SEC:-30}
      VIDEO_MIN_CHUNK_DURATION: ${VIDEO_MIN_CHUNK_DURATION:-45}
    volumes:
      - ./uploads:/app/uploads
      - ./models_cache:/app/models_cache
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ============================================================
  # Streamlit — дашборд
  # ============================================================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: vap-cpu:latest
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    # Код дашборда и тема монтируются из репо: Streamlit сам перечитывает
    # app.py при правках — не нужно пересобирать образ на каждую итерацию.
    volumes:
      - ./dashboard:/app/dashboard
      - ./.streamlit:/app/.streamlit
    environment:
      API_URL: ${API_URL:-http://api:8000}
    depends_on:
      - api

# ============================================================
  # Kafka — стриминг кадров и детекций
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,HOST://0.0.0.0:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_RETENTION_HOURS: 1           # raw_frames — 1 час
      KAFKA_LOG_RETENTION_BYTES: 1073741824  # 1GB максимум на партицию
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ============================================================
  # Kafka Init — явное создание топиков (разовый контейнер)
  #
  # Зачем: консьюмер НЕ умеет создавать топик — при подписке на несуществующий
  # raw_frames он циклично логирует "Broker: Unknown topic or partition",
  # пока первый продюсер не триггерит авто-создание. Создаём топики сами
  # до старта консьюмеров — чистые логи и предсказуемый конфиг (прод-практика).
  # retention задан per-topic (приоритетнее глобального KAFKA_LOG_RETENTION_*).
  # ============================================================
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command: >
      bash -c "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic raw_frames --partitions 3 --replication-factor 1
      --config retention.ms=3600000
      &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic detections --partitions 1 --replication-factor 1
      --config retention.ms=86400000
      &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic video_requests --partitions 8 --replication-factor 1
      --config retention.ms=86400000
      &&
      ( kafka-topics --bootstrap-server kafka:29092 --alter --topic video_requests --partitions 8
      || echo 'video_requests already has >= 8 partitions' )
      &&
      echo '--- Kafka topics ready ---'
      && kafka-topics --bootstrap-server kafka:29092 --list
      "

  # ============================================================
  # YOLO Consumer — обработка кадров из Kafka
  # ============================================================
  yolo-consumer:
    # Тот же CUDA-образ, что у worker (build + image совпадают — один билд)
    build:
      context: .
      dockerfile: Dockerfile
    image: vap-cuda:latest
    # Устройство не передаём аргументом — берётся из DEVICE (env ниже):
    # auto → cuda на GPU-машине, cpu без неё. Веса — из WEIGHTS_PATH (env),
    # не из CLI-аргумента: аргумент имеет приоритет над настройками и
    # захардкодил бы yolov8n навсегда.
    command: python -m app.consumers.yolo_frames
    # Липкая CUDA-ошибка убивает контекст в процессе — consumer сам выходит
    # с кодом 1 (см. yolo_consumer.py), а супервизор поднимает новый процесс
    # со свежим контекстом. Без этого GPU-сбой превращается в зомби, который
    # вечно «скипает» кадры и сжигает offset'ы.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@db:5432/${POSTGRES_DB:-vision}
      DEVICE: ${DEVICE:-auto}
      WEIGHTS_PATH: ${WEIGHTS_PATH:-yolov8n.pt}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin123}
      S3_BUCKET: ${S3_BUCKET:-vision}
    volumes:
      - ./uploads:/app/uploads
      - ./models_cache:/app/models_cache
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ============================================================
  # Video Consumer — обработка загруженных видео (заменил Celery worker)
  #
  # Читает задачи из топика video_requests, гонит видео через тот же
  # processor.py, что раньше выполнял Celery-воркер. Статус и прогресс —
  # в БД, offset Kafka коммитится после обработки (at-least-once).
  #
  # Длинные видео API режет на чанки по времени (см. app/processing/
  # planner.py): в топике оказывается N задач по срезу [start_s, end_s),
  # и реплики группы берут их ПАРАЛЛЕЛЬНО — отсюда 8 партиций у топика.
  # Короткие видео — одна задача, одиночный проход.
  #
  # Каждая реплика грузит модель в VRAM — мало памяти, поставь replicas: 1.
  # Больше реплик, чем партиций, смысла нет (лишние ждут).
  # ============================================================
  video-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    image: vap-cuda:latest
    command: python -m app.consumers.video
    # Липкая CUDA-ошибка: консьюмер выходит без коммита offset (см. модуль),
    # супервизор рестартует контейнер, задача будет доставлена заново.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@db:5432/${POSTGRES_DB:-vision}
      DEVICE: ${DEVICE:-auto}
      WEIGHTS_PATH: ${WEIGHTS_PATH:-yolov8n.pt}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin123}
      S3_BUCKET: ${S3_BUCKET:-vision}
      # Воркер перестраивает план чанков из тех же параметров, что и API
      VIDEO_CHUNK_SEC: ${VIDEO_CHUNK_SEC:-30}
      VIDEO_MIN_CHUNK_DURATION: ${VIDEO_MIN_CHUNK_DURATION:-45}
    volumes:
      - ./models_cache:/app/models_cache
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      replicas: 2

  # ============================================================
  # Detection Consumer — сохранение детекций в БД
  # ============================================================
  detection-consumer:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: vap-cpu:latest
    command: python -m app.consumers.detections
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@db:5432/${POSTGRES_DB:-vision}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  # ============================================================
  # Stream Manager — единственный владелец процессов producer'а
  #
  # Реализует паттерн desired-state + reconciler: API пишет в БД только
  # намерение (desired_status), а этот сервис крутит reconcile loop —
  # поднимает недостающих producer'ов и убивает лишних. Благодаря этому
  # рестарт api НЕ убивает стримы (процессы живут здесь, а не в api).
  #
  # Нужны DATABASE_URL (читать desired / писать status) и Kafka: порождённые
  # producer'ы-дети наследуют окружение отсюда, поэтому KAFKA_BOOTSTRAP_SERVERS
  # обязан быть задан именно в этом сервисе. S3 не нужен — producer кадры
  # в Kafka кладёт, а в MinIO пишет yolo-consumer.
  # ============================================================
  stream-manager:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: vap-cpu:latest
    command: python -m app.streams.manager
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@db:5432/${POSTGRES_DB:-vision}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    # Файловые источники стримов (./uploads на хосте) открываются producer'ом
    # ВНУТРИ этого контейнера — монтируем ту же директорию, что у api/worker.
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # ============================================================
  # MediaMTX — RTSP сервер для симуляции камеры
  # ============================================================
  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"   # RTSP
      - "8889:8889"   # WebRTC (опционально)
    environment:
      MTX_RTSP_TRANSPORTS: tcp

  # ============================================================
  # MinIO — S3-совместимое хранилище файлов
  # ============================================================
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # Web Console
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  minio_data:
