# ============================================================
# Vision Analytics Platform — Docker Compose
#
# Все секреты и хосты подставляются из переменных окружения:
# compose читает их из файла .env в корне проекта (см. .env.example).
# Формат ${VAR:-default} = взять VAR из .env, а если его нет — дефолт.
# Дефолты безопасны для локальной разработки и НЕ содержат реальных секретов.
#
# GPU: базовый файл работает на ЛЮБОЙ машине — GPU-резервы вынесены в
# docker-compose.gpu.yml. На NVIDIA-машине подключи его вручную или используй
# make up (Makefile сам определит GPU по nvidia-smi и добавит override-файл).
#
# ОБРАЗЫ (vap = Vision Analytics Platform):
#   vap-cuda — torch+CUDA, только worker и yolo-consumer (инференс, ~10-11 GB)
#   vap-cpu  — без torch: api, flower, detection-consumer, dashboard (~2 GB)
# Оба строятся один раз: сервисы с одинаковыми build+image делят один образ.
# ============================================================

services:
  # ============================================================
  # PostgreSQL — база данных
  # ============================================================
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DB:-vision}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-vision}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis — брокер сообщений для Celery
  # ============================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # FastAPI — бэкенд
  # ============================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: vap-cpu:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@db:5432/${POSTGRES_DB:-vision}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin123}
      S3_BUCKET: ${S3_BUCKET:-vision}
    volumes:
      - ./uploads:/app/uploads
      - ./models_cache:/app/models_cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ============================================================
  # Celery Worker — обработка видео (YOLO)
  # ============================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: vap-cuda:latest
    # --pool=solo (без форка): CUDA-контекст не переживает fork(), а дефолтный
    # prefork-пул Celery как раз форкает дочерние процессы → RuntimeError
    # "Cannot re-initialize CUDA in forked subprocess". В solo задачи выполняются
    # прямо в главном процессе. Параллелизм даём replicas: 2 — два независимых
    # контейнера (каждый грузит модель в VRAM; мало памяти — поставь 1).
    command: celery -A app.core.celery_app worker --loglevel=info --pool=solo -Q processing -E
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@db:5432/${POSTGRES_DB:-vision}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      DEVICE: ${DEVICE:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin123}
      S3_BUCKET: ${S3_BUCKET:-vision}
    volumes:
      - ./uploads:/app/uploads
      - ./models_cache:/app/models_cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      replicas: 2

  # ============================================================
  # Flower — мониторинг Celery
  # ============================================================
  flower:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: vap-cpu:latest
    command: celery -A app.core.celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    depends_on:
      redis:
        condition: service_healthy

  # ============================================================
  # Streamlit — дашборд
  # ============================================================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: vap-cpu:latest
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      API_URL: ${API_URL:-http://api:8000}
    depends_on:
      - api

# ============================================================
  # Kafka — стриминг кадров и детекций
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,HOST://0.0.0.0:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_RETENTION_HOURS: 1           # raw_frames — 1 час
      KAFKA_LOG_RETENTION_BYTES: 1073741824  # 1GB максимум на партицию
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ============================================================
  # Kafka Init — явное создание топиков (разовый контейнер)
  #
  # Зачем: консьюмер НЕ умеет создавать топик — при подписке на несуществующий
  # raw_frames он циклично логирует "Broker: Unknown topic or partition",
  # пока первый продюсер не триггерит авто-создание. Создаём топики сами
  # до старта консьюмеров — чистые логи и предсказуемый конфиг (прод-практика).
  # retention задан per-topic (приоритетнее глобального KAFKA_LOG_RETENTION_*).
  # ============================================================
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command: >
      bash -c "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic raw_frames --partitions 3 --replication-factor 1
      --config retention.ms=3600000
      &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic detections --partitions 1 --replication-factor 1
      --config retention.ms=86400000
      &&
      echo '--- Kafka topics ready ---'
      && kafka-topics --bootstrap-server kafka:29092 --list
      "

  # ============================================================
  # YOLO Consumer — обработка кадров из Kafka
  # ============================================================
  yolo-consumer:
    # Тот же CUDA-образ, что у worker (build + image совпадают — один билд)
    build:
      context: .
      dockerfile: Dockerfile
    image: vap-cuda:latest
    # Устройство не передаём аргументом — берётся из DEVICE (env ниже):
    # auto → cuda на GPU-машине, cpu без неё
    command: python -m app.streaming.yolo_consumer yolov8n.pt
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@db:5432/${POSTGRES_DB:-vision}
      DEVICE: ${DEVICE:-auto}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin123}
      S3_BUCKET: ${S3_BUCKET:-vision}
    volumes:
      - ./uploads:/app/uploads
      - ./models_cache:/app/models_cache
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ============================================================
  # Detection Consumer — сохранение детекций в БД
  # ============================================================
  detection-consumer:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: vap-cpu:latest
    command: python -m app.streaming.consumer
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@db:5432/${POSTGRES_DB:-vision}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  # ============================================================
  # MediaMTX — RTSP сервер для симуляции камеры
  # ============================================================
  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"   # RTSP
      - "8889:8889"   # WebRTC (опционально)
    environment:
      MTX_RTSP_TRANSPORTS: tcp

  # ============================================================
  # MinIO — S3-совместимое хранилище файлов
  # ============================================================
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # Web Console
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  minio_data:
