# ============================================================
# Vision Analytics Platform — Docker Compose
#
# Все секреты и хосты подставляются из переменных окружения:
# compose читает их из файла .env в корне проекта (см. .env.example).
# Формат ${VAR:-default} = взять VAR из .env, а если его нет — дефолт.
# Дефолты безопасны для локальной разработки и НЕ содержат реальных секретов.
#
# GPU: нужен ОДИН сервису triton — инференс платформы целиком живёт в
# Triton Inference Server (TensorRT engine). Консьюмеры ходят к нему по
# docker-сети и сами GPU не требуют. Без NVIDIA стек запускать бессмысленно:
# без Triton детекций не будет ни у видео, ни у стримов.
#
# Engine (model.plan) НЕ хранится в git: он привязан к модели GPU и версии
# TensorRT. Собирается во внешней репе yolo-trt-nms:
#   python export.py --mode triton --model-path <weights> --score 0.25 --max-det 300
# и копируется в models/triton/yolo_detector/1/model.plan. Тег образа Triton
# ОБЯЗАН совпадать с тегом сборки engine — TensorRT engine не переносим между
# версиями TRT и моделями GPU.
#
# ОБРАЗ (vap = Vision Analytics Platform):
#   vap-cpu — единый образ без torch (~2 GB): api, dashboard, все консьюмеры.
#   Сервисы с одинаковыми build+image делят один образ.
# ============================================================

services:
  # ============================================================
  # PostgreSQL — база данных
  # ============================================================
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DB:-vision}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-vision}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # FastAPI — бэкенд
  # ============================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: vap-cpu:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@db:5432/${POSTGRES_DB:-vision}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      # Presigned URL для браузера (st.video в дашборде) подписываем
      # публичным адресом — браузер не резолвит minio:9000 из docker-сети.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin123}
      S3_BUCKET: ${S3_BUCKET:-vision}
      # Чанкование: API планирует план диспетчеризации при загрузке
      VIDEO_CHUNK_SEC: ${VIDEO_CHUNK_SEC:-30}
      VIDEO_MIN_CHUNK_DURATION: ${VIDEO_MIN_CHUNK_DURATION:-45}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ============================================================
  # Streamlit — дашборд
  # ============================================================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: vap-cpu:latest
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    # Код дашборда и тема монтируются из репо: Streamlit сам перечитывает
    # app.py при правках — не нужно пересобирать образ на каждую итерацию.
    volumes:
      - ./dashboard:/app/dashboard
      - ./.streamlit:/app/.streamlit
    environment:
      API_URL: ${API_URL:-http://api:8000}
    depends_on:
      - api

# ============================================================
  # Kafka — стриминг кадров и детекций
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,HOST://0.0.0.0:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_RETENTION_HOURS: 1           # raw_frames — 1 час
      KAFKA_LOG_RETENTION_BYTES: 1073741824  # 1GB максимум на партицию
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ============================================================
  # Kafka Init — явное создание топиков (разовый контейнер)
  #
  # Зачем: консьюмер НЕ умеет создавать топик — при подписке на несуществующий
  # raw_frames он циклично логирует "Broker: Unknown topic or partition",
  # пока первый продюсер не триггерит авто-создание. Создаём топики сами
  # до старта консьюмеров — чистые логи и предсказуемый конфиг (прод-практика).
  # retention задан per-topic (приоритетнее глобального KAFKA_LOG_RETENTION_*).
  # ============================================================
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command: >
      bash -c "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic raw_frames --partitions 6 --replication-factor 1
      --config retention.ms=3600000
      &&
      ( kafka-topics --bootstrap-server kafka:29092 --alter --topic raw_frames --partitions 6
      || echo 'raw_frames already has >= 6 partitions' )
      &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic detections --partitions 1 --replication-factor 1
      --config retention.ms=86400000
      &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic video_requests --partitions 8 --replication-factor 1
      --config retention.ms=86400000
      &&
      ( kafka-topics --bootstrap-server kafka:29092 --alter --topic video_requests --partitions 8
      || echo 'video_requests already has >= 8 partitions' )
      &&
      echo '--- Kafka topics ready ---'
      && kafka-topics --bootstrap-server kafka:29092 --list
      "

  # ============================================================
  # Triton Inference Server — ЕДИНСТВЕННЫЙ инференс платформы
  #
  # Держит TensorRT engine (yolov8, NMS вшит в граф) на одном GPU;
  # video-consumer и yolo-consumer ходят к нему по docker-сети
  # (TRITON_URL=triton:8001) и сами GPU не требуют. Engine и его
  # сборка — см. шапку файла.
  # ============================================================
  triton:
    image: nvcr.io/nvidia/tritonserver:26.01-py3
    container_name: vap-triton
    command: >
      tritonserver
      --model-repository=/models
      --model-control-mode=none
    volumes:
      - ./models/triton:/models:ro
    shm_size: 4gb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ============================================================
  # YOLO Consumer — обработка кадров из Kafka
  # ============================================================
  yolo-consumer:
    # Единый CPU-образ: инференс в Triton'е, torch консьюмеру не нужен
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: vap-cpu:latest
    command: python -m app.consumers.yolo_frames
    # Две реплики — симметрично с video-consumer
    # Партиций у raw_frames 6 — на вырост: вернуть replicas: 3 можно без
    # репартиционирования.
    deploy:
      replicas: 2
    # 10 падений подряд (Triton лёг, сеть легла) — консьюмер сам выходит с
    # кодом 1 (см. MAX_CONSECUTIVE_FAILURES в yolo_frames.py), а супервизор
    # поднимает новый процесс. Без этого консьюмер превращается в зомби,
    # который вечно «скипает» кадры и сжигает offset'ы.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@db:5432/${POSTGRES_DB:-vision}
      TRITON_URL: ${TRITON_URL:-triton:8001}
      TRITON_MODEL_NAME: ${TRITON_MODEL_NAME:-yolo_detector}
      # Стримовый инференс — async-поток в Triton (батчи склеивает сервер).
      # Без явной передачи оверрайд из .env не доезжает до контейнера
      # (environment — белый список, не env_file).
      # YOLO_INFER_WINDOW — сколько кадров держать «в полёте» к Triton.
      # TRITON_CHANNELS — независимые gRPC-каналы клиента (= потоки отправки).
      # YOLO_IO_WORKERS — потоки декода: при упоре в декод (≈115–130 fps
      # на 4 воркерах) поднимать до 8.
      YOLO_INFER_WINDOW: ${YOLO_INFER_WINDOW:-64}
      TRITON_CHANNELS: ${TRITON_CHANNELS:-4}
      YOLO_IO_WORKERS: ${YOLO_IO_WORKERS:-4}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin123}
      S3_BUCKET: ${S3_BUCKET:-vision}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      triton:
        condition: service_healthy

  # ============================================================
  # Video Consumer — обработка загруженных видео (заменил Celery worker)
  #
  # Читает задачи из топика video_requests, гонит видео через тот же
  # processor.py, что раньше выполнял Celery-воркер. Статус и прогресс —
  # в БД, offset Kafka коммитится после обработки (at-least-once).
  #
  # Длинные видео API режет на чанки по времени (см. app/processing/
  # planner.py): в топике оказывается N задач по срезу [start_s, end_s),
  # и реплики группы берут их ПАРАЛЛЕЛЬНО — отсюда 8 партиций у топика.
  # Короткие видео — одна задача, одиночный проход.
  #
  # Реплики лёгкие (инференс в Triton'е, VRAM консьюмеру не нужна).
  # Больше реплик, чем партиций, смысла нет (лишние ждут).
  # ============================================================
  video-consumer:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: vap-cpu:latest
    command: python -m app.consumers.video
    # Падение консьюмера — выход без коммита offset (см. модуль),
    # супервизор рестартует контейнер, задача будет доставлена заново.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@db:5432/${POSTGRES_DB:-vision}
      TRITON_URL: ${TRITON_URL:-triton:8001}
      TRITON_MODEL_NAME: ${TRITON_MODEL_NAME:-yolo_detector}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin123}
      S3_BUCKET: ${S3_BUCKET:-vision}
      # Воркер перестраивает план чанков из тех же параметров, что и API
      VIDEO_CHUNK_SEC: ${VIDEO_CHUNK_SEC:-30}
      VIDEO_MIN_CHUNK_DURATION: ${VIDEO_MIN_CHUNK_DURATION:-45}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      triton:
        condition: service_healthy
    deploy:
      replicas: 2

  # ============================================================
  # Detection Consumer — сохранение детекций в БД
  # ============================================================
  detection-consumer:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: vap-cpu:latest
    command: python -m app.consumers.detections
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@db:5432/${POSTGRES_DB:-vision}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      DETECTION_BATCH_SIZE: ${DETECTION_BATCH_SIZE:-64}
      DETECTION_BATCH_GRACE_MS: ${DETECTION_BATCH_GRACE_MS:-50}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  # ============================================================
  # Stream Manager — единственный владелец процессов producer'а
  #
  # Реализует паттерн desired-state + reconciler: API пишет в БД только
  # намерение (desired_status), а этот сервис крутит reconcile loop —
  # поднимает недостающих producer'ов и убивает лишних. Благодаря этому
  # рестарт api НЕ убивает стримы (процессы живут здесь, а не в api).
  #
  # Нужны DATABASE_URL (читать desired / писать status) и Kafka: порождённые
  # producer'ы-дети наследуют окружение отсюда, поэтому KAFKA_BOOTSTRAP_SERVERS
  # обязан быть задан именно в этом сервисе. S3 не нужен — producer кадры
  # в Kafka кладёт, а в MinIO пишет yolo-consumer.
  # ============================================================
  stream-manager:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: vap-cpu:latest
    command: python -m app.streams.manager
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@db:5432/${POSTGRES_DB:-vision}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    # Файловые источники стримов (./uploads на хосте) открываются producer'ом
    # ВНУТРИ этого контейнера — монтируем ту же директорию, что у api/worker.
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # ============================================================
  # MediaMTX — RTSP сервер для симуляции камеры
  # ============================================================
  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"   # RTSP
      - "8889:8889"   # WebRTC (опционально)
    environment:
      MTX_RTSP_TRANSPORTS: tcp

  # ============================================================
  # MinIO — S3-совместимое хранилище файлов
  # ============================================================
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # Web Console
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # Observability — Prometheus + Kafka exporter + Grafana
  #
  # Консьюмеры отдают /metrics сами (start_metrics_server в процессах),
  # Prometheus раз в 10с обходит все таргеты и складывает значения в TSDB
  # (retention 7d), Grafana рендерит PromQL-запросы из Prometheus.
  # Конфиги — в monitoring/ (версионируются в репо, правка = коммит).
  #
  # video-consumer работает в N репликах: Prometheus открывает на каждую
  # отдельный таргет (dns_sd type=A, см. monitoring/prometheus) — иначе
  # round-robin DNS склеивает счётчики реплик в одну серию и rate()/
  # квантили врут. Суммарные графики в Grafana даёт sum()/sum by (le).
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.53.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # POST /api/v1/admin/tsdb/delete_series — штатная зачистка серий
      # (пригодилась после фикса скрейпинга: вычистить историю старого
      # round-robin таргета). Без auth, поэтому порт торчит только в
      # localhost-интерфейс, не в LAN.
      - --web.enable-admin-api
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - kafka-exporter

  kafka-exporter:
    # Лаг консьюмер-групп и размеры топиков: kafka_exporter читает
    # committed offsets брокера, своих настроек по группам не требует —
    # экспортирует все группы, нужные отфильтрованы в Grafana-запросах.
    # ВНИМАНИЕ: имя образа на Hub — через дефис (kafka-exporter), репозиторий
    # с подчёркиванием (kafka_exporter) удалён; тег v2.0.0 не существует,
    # актуальная линейка — v1.x.
    image: danielqsj/kafka-exporter:v1.11.0
    command: ["--kafka.server=kafka:29092"]
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      # Анонимный доступ — только просмотр: открыть дашборд можно без
      # регистрации, что удобно для демо и локальной разработки.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      # Provisioning из репо: datasource и дашборд подхватываются при
      # старте — ничего не нужно кликать руками в UI.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  minio_data:
  prometheus_data:
  grafana_data:
