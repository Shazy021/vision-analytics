# docker-compose.yml — оркестратор: поднимает все сервисы одной командой
#
# Запуск:      docker-compose up --build
# Остановка:   docker-compose down
# С логами:    docker-compose up --build -d && docker-compose logs -f
#
# Каждый сервис:
#   build — откуда брать Dockerfile
#   ports — проброс портов (хост:контейнер)
#   environment — переменные окружения
#   depends_on — зависимости (запускаются раньше)
#   volumes — проброс файлов с хоста в контейнер

services:
  # ============================================================
  # PostgreSQL — база данных
  # ============================================================
  db:
    image: postgres:16-alpine
    # alpine — минимальный образ (80MB vs 400MB у полного)
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: vision
    ports:
      - "5432:5432"
    volumes:
      # pgdata — именованный том, данные БД переживают перезапуск
      # Без этого — каждый docker-compose down удаляет все данные
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # healthcheck — Docker ждёт пока БД будет готова
      # Без этого FastAPI может стартовать раньше PostgreSQL → ошибка подключения
      test: ["CMD-SHELL", "pg_isready -U user -d vision"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # FastAPI — бэкенд
  # ============================================================
  api:
    build:
      context: .              # корень проекта — откуда брать файлы
      dockerfile: Dockerfile  # какой Dockerfile использовать
    ports:
      - "8000:8000"
    environment:
      # В Docker сервисы общаются по именам (db, api, dashboard)
      # Не localhost! db = сервис PostgreSQL в той же Docker-сети
      DATABASE_URL: postgresql://user:pass@db:5432/vision
      EXTRACT_FPS: 5
      MAX_FRAMES: 0
      WEIGHTS_PATH: yolov8n.pt
      DEVICE: cpu
    volumes:
      # uploads — загруженные видео должны переживать перезапуск
      # и быть доступны между сервисами
      - ./uploads:/app/uploads
      # Модели YOLO — качаются один раз, не каждый пересборку
      - ./models_cache:/app/models_cache
    depends_on:
      db:
        condition: service_healthy  # ждём пока БД пройдёт healthcheck

  # ============================================================
  # Streamlit — дашборд
  # ============================================================
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "8501:8501"
    environment:
      # Дашборд обращается к API по имени сервиса
      API_URL: http://api:8000
    depends_on:
      - api  # API должен быть запущен (но не обязательно готов)

# Именованные тома
volumes:
  pgdata:  # данные PostgreSQL