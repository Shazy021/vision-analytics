# ============================================================
# Prometheus — сбор метрик пайплайна видеоналитики.
#
# Модель: pull. Каждый сервис отдаёт plain HTTP /metrics, Prometheus
# приходит сам каждые 10 секунд и складывает значения в свой TSDB
# (retention 7d задаётся флагом в docker-compose.yml).
#
# Таргеты — docker-DNS имена сервисов из compose; порты консьюмеров —
# дефолты start_metrics_server (METRICS_PORT в compose не переопределяется,
# иначе таргеты разъедутся с реальными портами).
#
# api скрейпится на :8000 — prometheus-fastapi-instrumentator вешает
# /metrics на порт самого приложения, отдельный порт api не поднимает.
# ============================================================
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  # Та же схема, что у video-consumer (комментарий ниже): реплики масштабируются,
  # static-таргет на DNS-имя сервиса чередовал бы их round-robin как один процесс.
  - job_name: yolo-consumer
    dns_sd_configs:
      - names: ["yolo-consumer"]
        type: "A"
        port: 9091
        refresh_interval: 10s

  # Тот же рецепт, что у video-consumer ниже: detection-consumer масштабируется
  # репликами, static-таргет на DNS-имя чередовал бы их round-robin как один
  # процесс и ломал rate()/квантили.
  - job_name: detection-consumer
    dns_sd_configs:
      - names: ["detection-consumer"]
        type: "A"
        port: 9092
        refresh_interval: 10s

  # video-consumer масштабируется репликами: один static-таргет на DNS-имя
  # сервиса давал round-robin — Prometheus читал то одну, то другую реплику
  # как ОДИН процесс, счётчики чередовались (13/16/13/16), и rate()/
  # increase()/квантили рисовали фантомные задачи. dns_sd type=A спрашивает
  # Docker DNS один раз и получает ВСЕ IP реплик → отдельный таргет и своя
  # серия на каждую; Grafana суммирует их sum()/sum by (le). При --scale
  # ничего править не надо. (tasks.<service> для этого не нужен — это Swarm;
  # в Compose обычное имя сервиса уже отдаёт все A-записи.)
  - job_name: video-consumer
    dns_sd_configs:
      - names: ["video-consumer"]
        type: "A"
        port: 9093
        refresh_interval: 10s

  # Triton сам отдаёт Prometheus-метрики на :8002/metrics (по умолчанию
  # включено, порт 8002). Что полезно:
  #   nv_inference_count / nv_inference_exec_count — средний батч, которым
  #     движок реально крутит прогоны (динамический батчинг: склеивает ли
  #     наши одиночные async-запросы);
  #   nv_inference_request_duration_us / nv_inference_queue_duration_us /
  #     nv_inference_compute_infer_duration_us — очередь vs инференс;
  #   nv_inference_pending_request_count — размер очереди движка;
  #   nv_gpu_utilization (0..1), nv_gpu_memory_used_bytes — загрузка GPU.
  # Triton — обязательная часть стека (единственный инференс), описан прямо в
  # docker-compose.yml. Если он не поднялся (нет GPU или engine'а) — таргет
  # DOWN, и это честная картина, а не поломка скрейпинга.
  - job_name: triton
    static_configs:
      - targets: ["triton:8002"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
